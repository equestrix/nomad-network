<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Nomad Network</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin />
  <style>
    :root{
      --bg:#0b0f0d;
      --panel:#121914;
      --panel2:#18231b;
      --green:#39d353;
      --green2:#1f7a35;
      --text:#e8f5ea;
      --muted:#9caf9f;
      --border:#294332;
      --danger:#ff5c5c;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; margin:0; background:#0fa8d2; color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    button,input,select,textarea{ font:inherit; }

    #topbar{
      position:fixed; top:0; left:0; right:0; height:64px; z-index:1000;
      display:flex; align-items:center; gap:12px;
      background:rgba(11,15,13,.94); color:var(--text);
      border-bottom:1px solid var(--border);
      padding:10px 14px;
      backdrop-filter:blur(8px);
    }

    #brand{
      display:flex; flex-direction:column; line-height:1.1; min-width:170px;
    }
    #brand strong{ color:var(--green); letter-spacing:.06em; font-size:15px; }
    #brand span{ color:var(--muted); font-size:12px; }

    .control-group{ display:flex; align-items:center; gap:8px; }
    .check{
      display:flex; align-items:center; gap:6px;
      color:var(--text); font-size:14px; white-space:nowrap;
    }
    .check input{ transform:translateY(1px); }

    .btn{
      border:1px solid var(--border);
      background:var(--panel2);
      color:var(--text);
      padding:7px 10px;
      border-radius:8px;
      cursor:pointer;
      font-weight:700;
    }
    .btn:hover{ filter:brightness(1.12); }
    .btn.primary{ background:var(--green2); border-color:var(--green); }
    .btn.danger{ background:#3a1616; border-color:#7c2b2b; color:#ffd5d5; }
    .btn.ghost{ background:transparent; }
    .btn:disabled{ opacity:.45; cursor:not-allowed; }

    #garageSelect{
      min-width:230px;
      background:var(--panel2);
      color:var(--text);
      border:1px solid var(--border);
      padding:7px 10px;
      border-radius:8px;
    }

    #hint{
      color:var(--muted);
      font-size:13px;
      margin-left:auto;
      white-space:nowrap;
    }

    #map{
      position:absolute;
      inset:64px 0 0 0;
      background:#0fa8d2;
    }
    .leaflet-container{ background:#0fa8d2; }
    .leaflet-control-zoom a{ background:#101711; color:var(--text); border-color:var(--border); }
    .leaflet-control-zoom a:hover{ background:#18231b; color:var(--green); }

    #loginGate{
      position:fixed; inset:0; z-index:3000;
      display:grid; place-items:center;
      background:radial-gradient(circle at top, #193b24, #080b09 65%);
      padding:20px;
    }
    #loginCard{
      width:min(440px, calc(100vw - 32px));
      background:rgba(18,25,20,.96);
      border:1px solid var(--border);
      border-radius:16px;
      box-shadow:0 20px 70px rgba(0,0,0,.5);
      padding:22px;
    }
    #loginCard h1{
      margin:0 0 6px;
      color:var(--green);
      letter-spacing:.08em;
      font-size:24px;
    }
    #loginCard p{ margin:0 0 18px; color:var(--muted); }
    #passwordInput{
      width:100%;
      background:#0b0f0d;
      color:var(--text);
      border:1px solid var(--border);
      padding:11px 12px;
      border-radius:10px;
      margin-bottom:12px;
    }
    #loginMsg{ min-height:18px; color:#ffb4b4; font-size:13px; margin-top:10px; }

    .modal{
      position:fixed; inset:0; z-index:2000;
      display:none; place-items:center;
      background:rgba(0,0,0,.55);
      padding:18px;
    }
    .modal.show{ display:grid; }
    .card{
      width:min(520px, calc(100vw - 24px));
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:14px;
      box-shadow:0 18px 60px rgba(0,0,0,.45);
      overflow:hidden;
    }
    .card header{
      background:var(--panel2);
      border-bottom:1px solid var(--border);
      padding:13px 15px;
      font-weight:800;
      color:var(--green);
    }
    .card main{ padding:15px; display:grid; gap:12px; }
    .card footer{
      padding:13px 15px;
      display:flex;
      justify-content:flex-end;
      gap:8px;
      border-top:1px solid var(--border);
      background:#0f1511;
    }
    label.field{ display:grid; gap:6px; color:var(--muted); font-size:13px; }
    label.field input,label.field select,label.field textarea{
      width:100%;
      background:#0b0f0d;
      color:var(--text);
      border:1px solid var(--border);
      border-radius:9px;
      padding:9px 10px;
    }
    label.field textarea{ min-height:92px; resize:vertical; }
    .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

    .popup{
      min-width:220px;
      color:#111;
    }
    .popup h3{
      margin:0 0 8px;
      font-size:16px;
    }
    .popup p{ margin:5px 0; }
    .popup .type-pill{
      display:inline-block;
      padding:3px 7px;
      border-radius:999px;
      background:#132017;
      color:#39d353;
      font-weight:800;
      font-size:12px;
    }
    .popup-actions{
      margin-top:10px;
      display:flex;
      gap:6px;
    }
    .popup-actions button{
      border:0;
      border-radius:6px;
      padding:5px 8px;
      cursor:pointer;
      font-weight:700;
    }

    #status{
      position:fixed; left:10px; bottom:10px; z-index:1200;
      background:rgba(11,15,13,.86);
      color:var(--text);
      border:1px solid var(--border);
      border-radius:8px;
      padding:6px 9px;
      font-size:12px;
    }
    #version{
      position:fixed; right:10px; bottom:10px; z-index:1200;
      background:rgba(11,15,13,.86);
      color:var(--muted);
      border:1px solid var(--border);
      border-radius:8px;
      padding:6px 9px;
      font-size:12px;
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    }

    @media (max-width:900px){
      #topbar{ height:auto; min-height:64px; flex-wrap:wrap; }
      #map{ inset:112px 0 0 0; }
      #hint{ margin-left:0; width:100%; }
      #garageSelect{ min-width:180px; flex:1; }
    }
  </style>
</head>
<body>
  <div id="loginGate">
    <div id="loginCard">
      <h1>NOMAD NETWORK</h1>
      <p>Enter the network password to access the map.</p>
      <input id="passwordInput" type="password" placeholder="Password" autocomplete="current-password" />
      <button id="loginBtn" class="btn primary" style="width:100%">Unlock Network</button>
      <div id="loginMsg"></div>
    </div>
  </div>

  <div id="topbar">
    <div id="brand">
      <strong>NOMAD NETWORK</strong>
      <span>Underground Intelligence Map</span>
    </div>

    <div class="control-group">
      <label class="check"><input id="addMode" type="checkbox"> Add</label>
      <label class="check"><input id="editMode" type="checkbox"> Edit</label>
    </div>

    <div class="control-group">
      <label class="check"><input id="showPublic" type="checkbox" checked> Public garages</label>
      <label class="check"><input id="showHidden" type="checkbox" checked> Hidden garages</label>
    </div>

    <select id="garageSelect">
      <option value="">Jump to marker...</option>
    </select>

    <button id="exportBtn" class="btn">Export</button>
    <button id="lockBtn" class="btn ghost">Lock</button>

    <div id="hint">Locked</div>
  </div>

  <div id="map"></div>
  <div id="status">Loading map...</div>
  <div id="version">v1.3</div>

  <div id="markerModal" class="modal" aria-hidden="true">
    <div class="card">
      <header id="modalTitle">Add Marker</header>
      <main>
        <label class="field">
          <span>Name</span>
          <input id="markerName" type="text" placeholder="Example: Legion Square Garage" />
        </label>

        <div class="grid2">
          <label class="field">
            <span>Type</span>
            <select id="markerType">
              <option value="public_garage">Public Garage</option>
              <option value="hidden_garage">Hidden Garage</option>
            </select>
          </label>
          <label class="field">
            <span>Last Checked</span>
            <input id="markerLastChecked" type="date" />
          </label>
        </div>

        <label class="field">
          <span>Notes</span>
          <textarea id="markerNotes" placeholder="Useful details, access notes, risk, etc."></textarea>
        </label>
      </main>
      <footer>
        <button id="deleteBtn" class="btn danger" style="margin-right:auto;display:none">Delete</button>
        <button id="cancelBtn" class="btn ghost">Cancel</button>
        <button id="saveBtn" class="btn primary">Save</button>
      </footer>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getAuth, signInAnonymously, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      getFirestore, collection, onSnapshot, addDoc, doc, updateDoc, deleteDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    // =========================
    // CHANGE THESE SETTINGS
    // =========================
    const NETWORK_PASSWORD = "NOMAD";
    const COLLECTION = "nomad_markers";

    // PASTE YOUR NEW NOMAD NETWORK FIREBASE CONFIG HERE.
    // Firebase Console → Project settings → Your apps → Web app config
    const firebaseConfig = {
      apiKey: "AIzaSyCJbVIfuyDicMKciQJ1k_kEjXH0n-5GY6s",
      authDomain: "nomad-network-401ec.firebaseapp.com",
      projectId: "nomad-network-401ec",
      storageBucket: "nomad-network-401ec.firebasestorage.app",
      messagingSenderId: "1027418265124",
      appId: "1:1027418265124:web:e526d34a40bd5bc156aab1",
      measurementId: "G-T6ST1YX2EX"
    };

    // =========================
    // App state
    // =========================
    let app, auth, db, markersCol;
    let map, imageBounds;
    let unlocked = false;
    let pendingLatLng = null;
    let editingId = null;
    let currentIconSize = 24;

    const markerData = new Map();
    const leafletMarkers = new Map();
    const layers = {
      public_garage: L.layerGroup(),
      hidden_garage: L.layerGroup()
    };

    const $ = (id) => document.getElementById(id);

    const loginGate = $("loginGate");
    const passwordInput = $("passwordInput");
    const loginBtn = $("loginBtn");
    const loginMsg = $("loginMsg");
    const addMode = $("addMode");
    const editMode = $("editMode");
    const showPublic = $("showPublic");
    const showHidden = $("showHidden");
    const garageSelect = $("garageSelect");
    const exportBtn = $("exportBtn");
    const lockBtn = $("lockBtn");
    const hint = $("hint");
    const status = $("status");

    const markerModal = $("markerModal");
    const modalTitle = $("modalTitle");
    const markerName = $("markerName");
    const markerType = $("markerType");
    const markerLastChecked = $("markerLastChecked");
    const markerNotes = $("markerNotes");
    const deleteBtn = $("deleteBtn");
    const cancelBtn = $("cancelBtn");
    const saveBtn = $("saveBtn");

    function setHint(text){ hint.textContent = text; }
    function todayISO(){ return new Date().toISOString().slice(0,10); }

    function typeLabel(type){
      if (type === "hidden_garage") return "Hidden Garage";
      return "Public Garage";
    }

    function iconFor(type){
      const file = type === "hidden_garage" ? "garage-hidden.png" : "garage-public.png";
      const s = currentIconSize;
      return L.icon({
        iconUrl: file,
        iconSize:[s,s],
        iconAnchor:[s/2,s/2],
        popupAnchor:[0,-s/2],
        tooltipAnchor:[0,-s/2]
      });
    }

    function layerFor(type){
      return type === "hidden_garage" ? layers.hidden_garage : layers.public_garage;
    }

    function escapeHtml(value){
      return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[c]));
    }

    function initFirebase(){
      if (!firebaseConfig.apiKey || firebaseConfig.apiKey.includes("PASTE_")) {
        loginMsg.textContent = "Firebase config is still blank. Paste your new Firebase config into index.html first.";
        throw new Error("Missing Firebase config");
      }

      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
      markersCol = collection(db, COLLECTION);

      onAuthStateChanged(auth, (user) => {
        if (user && unlocked) {
          loginGate.style.display = "none";
          setHint("Unlocked");
          startFirestoreListener();
        }
      });
    }

    function initMap(){
      const img = new Image();
      img.onload = () => {
        const w = img.naturalWidth;
        const h = img.naturalHeight;

        imageBounds = L.latLngBounds([[0,0],[h,w]]);

        map = L.map("map", {
          crs: L.CRS.Simple,
          minZoom: -2,
          maxZoom: 5,
          zoomSnap: .25,
          zoomDelta: .25,
          attributionControl:false
        });

        L.imageOverlay("map.jpg?v=" + Date.now(), imageBounds).addTo(map);
        map.fitBounds(imageBounds, { padding:[20,20] });

        layers.public_garage.addTo(map);
        layers.hidden_garage.addTo(map);

        map.on("zoomend", () => {
          const z = map.getZoom();
        currentIconSize = Math.max(18, Math.min(34, Math.round((z + 3) * 6)));
          leafletMarkers.forEach((marker, id) => {
            const data = markerData.get(id);
            if (data) marker.setIcon(iconFor(data.type));
          });
        });

        map.on("click", (e) => {
          if (!unlocked || !addMode.checked) return;
          openAddModal(e.latlng);
        });

        status.textContent = "Map ready";
      };

      img.onerror = () => {
        status.textContent = "Could not load map.jpg";
      };

      img.src = "map.jpg?v=" + Date.now();
    }

    let listening = false;
    function startFirestoreListener(){
      if (listening) return;
      listening = true;

      onSnapshot(markersCol, (snapshot) => {
        snapshot.docChanges().forEach(change => {
          const id = change.doc.id;

          if (change.type === "removed") {
            removeMarker(id);
            return;
          }

          const v = change.doc.data() || {};
          const data = {
            id,
            name: v.name || "Unnamed Marker",
            type: v.type || "public_garage",
            x: Number(v.x),
            y: Number(v.y),
            notes: v.notes || "",
            lastChecked: v.lastChecked || "",
          };

          if (!Number.isFinite(data.x) || !Number.isFinite(data.y)) return;
          upsertMarker(data);
        });

        updateGarageSelect();
        status.textContent = `Loaded ${markerData.size} markers`;
      }, (error) => {
        status.textContent = "Firestore error";
        console.error(error);
        alert("Firestore error: " + error.message);
      });
    }

    function upsertMarker(data){
      markerData.set(data.id, data);

      let marker = leafletMarkers.get(data.id);

      if (!marker) {
        marker = L.marker([data.y, data.x], {
          icon: iconFor(data.type),
          draggable: unlocked && editMode.checked
        });

        marker.on("dragend", async () => {
          if (!unlocked || !editMode.checked) return;
          const pos = marker.getLatLng();
          await updateDoc(doc(db, COLLECTION, data.id), {
            x: pos.lng,
            y: pos.lat,
            updatedAt: serverTimestamp()
          });
        });

        leafletMarkers.set(data.id, marker);
        layerFor(data.type).addLayer(marker);
      } else {
        const oldData = markerData.get(data.id);
        const oldType = oldData?.type;
        if (oldType && oldType !== data.type) {
          layerFor(oldType).removeLayer(marker);
          layerFor(data.type).addLayer(marker);
        }
        marker.setLatLng([data.y, data.x]);
        marker.setIcon(iconFor(data.type));
      }

      marker.bindTooltip(data.name, { direction:"top", offset:[0,-10] });
      marker.bindPopup(popupHtml(data), { autoPan:true });

      marker.off("popupopen");
      marker.on("popupopen", (e) => {
        const el = e.popup.getElement();
        if (!el) return;

        const edit = el.querySelector("[data-edit]");
        if (edit) {
          edit.addEventListener("click", (ev) => {
            ev.preventDefault();
            ev.stopPropagation();
            if (!editMode.checked) {
              alert("Turn on Edit first.");
              return;
            }
            openEditModal(data.id);
          });
        }
      });

      if (marker.dragging) {
  if (unlocked && editMode.checked) {
    marker.dragging.enable();
  } else {
    marker.dragging.disable();
  }
}
      applyLayerVisibility();
    }

    function popupHtml(data){
      const notes = data.notes ? `<p>${escapeHtml(data.notes)}</p>` : "";
      const last = data.lastChecked ? `<p><strong>Last checked:</strong> ${escapeHtml(data.lastChecked)}</p>` : "";
      const actions = unlocked ? `
        <div class="popup-actions">
          <button data-edit="${escapeHtml(data.id)}">Edit</button>
        </div>` : "";

      return `
        <div class="popup">
          <h3>${escapeHtml(data.name)}</h3>
          <p><span class="type-pill">${escapeHtml(typeLabel(data.type))}</span></p>
          ${notes}
          ${last}
          ${actions}
        </div>`;
    }

    function removeMarker(id){
      const data = markerData.get(id);
      const marker = leafletMarkers.get(id);
      if (data && marker) layerFor(data.type).removeLayer(marker);
      markerData.delete(id);
      leafletMarkers.delete(id);
      updateGarageSelect();
    }

function applyEditMode(){
  leafletMarkers.forEach((marker) => {
    if (!marker.dragging) return;

    if (unlocked && editMode.checked) {
      marker.dragging.enable();
    } else {
      marker.dragging.disable();
    }
  });

  setHint(editMode.checked ? "Edit mode on" : (addMode.checked ? "Add mode on" : "Unlocked"));
}

    function applyLayerVisibility(){
      if (!map) return;

      if (showPublic.checked) {
        if (!map.hasLayer(layers.public_garage)) layers.public_garage.addTo(map);
      } else {
        if (map.hasLayer(layers.public_garage)) map.removeLayer(layers.public_garage);
      }

      if (showHidden.checked) {
        if (!map.hasLayer(layers.hidden_garage)) layers.hidden_garage.addTo(map);
      } else {
        if (map.hasLayer(layers.hidden_garage)) map.removeLayer(layers.hidden_garage);
      }
    }

    function updateGarageSelect(){
      const selected = garageSelect.value;
      const entries = Array.from(markerData.values()).sort((a,b) => a.name.localeCompare(b.name));

      garageSelect.innerHTML = `<option value="">Jump to marker...</option>`;
      for (const m of entries) {
        const opt = document.createElement("option");
        opt.value = m.id;
        opt.textContent = `${m.name} — ${typeLabel(m.type)}`;
        garageSelect.appendChild(opt);
      }

      if (selected && markerData.has(selected)) garageSelect.value = selected;
    }

    function openAddModal(latlng){
      pendingLatLng = latlng;
      editingId = null;
      modalTitle.textContent = "Add Marker";
      markerName.value = "";
      markerType.value = "public_garage";
      markerLastChecked.value = todayISO();
      markerNotes.value = "";
      deleteBtn.style.display = "none";
      markerModal.classList.add("show");
      markerName.focus();
    }

    function openEditModal(id){
      const data = markerData.get(id);
      if (!data) return;

      pendingLatLng = null;
      editingId = id;
      modalTitle.textContent = "Edit Marker";
      markerName.value = data.name || "";
      markerType.value = data.type || "public_garage";
      markerLastChecked.value = data.lastChecked || "";
      markerNotes.value = data.notes || "";
      deleteBtn.style.display = "";
      markerModal.classList.add("show");
      markerName.focus();
    }

    function closeModal(){
      markerModal.classList.remove("show");
      pendingLatLng = null;
      editingId = null;
    }

    async function saveMarker(){
      const name = markerName.value.trim();
      const type = markerType.value;
      const notes = markerNotes.value.trim();
      const lastChecked = markerLastChecked.value;

      if (!name) {
        alert("Name is required.");
        return;
      }

      if (editingId) {
        await updateDoc(doc(db, COLLECTION, editingId), {
          name, type, notes, lastChecked,
          updatedAt: serverTimestamp()
        });
      } else {
        if (!pendingLatLng) return;
        await addDoc(markersCol, {
          name, type, notes, lastChecked,
          x: pendingLatLng.lng,
          y: pendingLatLng.lat,
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        });
      }

      closeModal();
    }

    async function deleteCurrentMarker(){
      if (!editingId) return;
      const data = markerData.get(editingId);
      if (!confirm(`Delete "${data?.name || "this marker"}"?`)) return;

      await deleteDoc(doc(db, COLLECTION, editingId));
      closeModal();
    }

    function exportMarkers(){
      const arr = Array.from(markerData.values())
        .sort((a,b) => a.name.localeCompare(b.name))
        .map(({id, name, type, x, y, notes, lastChecked}) => ({id, name, type, x, y, notes, lastChecked}));

      const blob = new Blob([JSON.stringify(arr, null, 2)], { type:"application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "nomad-markers.json";
      document.body.appendChild(a);
      a.click();
      URL.revokeObjectURL(url);
      a.remove();
    }

    async function unlock(){
      const pw = passwordInput.value.trim();
      if (pw !== NETWORK_PASSWORD) {
        loginMsg.textContent = "Wrong password.";
        return;
      }

      loginMsg.textContent = "Connecting...";
      try {
        unlocked = true;
        await signInAnonymously(auth);
        loginGate.style.display = "none";
        setHint("Unlocked");
        status.textContent = "Loading markers...";
        startFirestoreListener();
      } catch (error) {
        unlocked = false;
        loginMsg.textContent = "Firebase anonymous sign-in failed. Enable Anonymous Auth in Firebase.";
        console.error(error);
      }
    }

    async function lock(){
      unlocked = false;
      addMode.checked = false;
      editMode.checked = false;
      applyEditMode();
      try { await signOut(auth); } catch {}
      loginGate.style.display = "grid";
      passwordInput.value = "";
      passwordInput.focus();
      setHint("Locked");
    }

    loginBtn.addEventListener("click", unlock);
    passwordInput.addEventListener("keydown", (e) => { if (e.key === "Enter") unlock(); });
    addMode.addEventListener("change", () => {
      if (addMode.checked) editMode.checked = false;
      applyEditMode();
    });
    editMode.addEventListener("change", () => {
      if (editMode.checked) addMode.checked = false;
      applyEditMode();
    });
    showPublic.addEventListener("change", applyLayerVisibility);
    showHidden.addEventListener("change", applyLayerVisibility);
    garageSelect.addEventListener("change", () => {
      const id = garageSelect.value;
      if (!id) return;
      const data = markerData.get(id);
      const marker = leafletMarkers.get(id);
      if (!data || !marker) return;

      const type = data.type || "public_garage";
      if (type === "public_garage" && !showPublic.checked) showPublic.checked = true;
      if (type === "hidden_garage" && !showHidden.checked) showHidden.checked = true;
      applyLayerVisibility();

      map.setView([data.y, data.x], Math.min(1, Math.max(map.getZoom(), 0.25)));
      marker.openPopup();
    });
    exportBtn.addEventListener("click", exportMarkers);
    lockBtn.addEventListener("click", lock);
    cancelBtn.addEventListener("click", closeModal);
    saveBtn.addEventListener("click", () => saveMarker().catch(err => alert("Save failed: " + err.message)));
    deleteBtn.addEventListener("click", () => deleteCurrentMarker().catch(err => alert("Delete failed: " + err.message)));
    markerModal.addEventListener("click", (e) => { if (e.target === markerModal) closeModal(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

    initMap();
    initFirebase();
  </script>
</body>
</html>
